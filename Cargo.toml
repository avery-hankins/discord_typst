[package]
name = "discord_typst"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
poise = "0.6"
tokio = { version = "1.0", features = ["full"] }
typst-as-lib = "0.16.0"
typst = "0.15.0"
typst-render = "0.15.0"
typst-utils = "0.15.0"
typst-layout = "0.15.0"
typst-assets = { version = "0.15.0", features = ["fonts"] }

[lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
