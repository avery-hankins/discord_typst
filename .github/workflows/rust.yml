name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - uses: actions/cache@v4
      with:
        path: packages
        key: typst-pkgs-${{ hashFiles('packages/packages.txt', 'scripts/vendor-packages.sh') }}
    - name: Vendor Typst packages
      run: scripts/vendor-packages.sh
    - name: Format
      run: cargo fmt --check
    - name: Build
      run: cargo build --verbose
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose
